name: A4 C1 review fix validation

on:
  push:
    branches:
      - codex/a4-editor-core-c1

permissions:
  contents: write

jobs:
  review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/a4-editor-core-c1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize review-fix test rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/a4-c1-review-fix.py')
          s = p.read_text()
          start = s.index('old_a = """')
          end_marker = 'browser_path.write_text(browser)'
          end = s.index(end_marker, start) + len(end_marker)
          s = s[:start] + end_marker + s[end:]
          p.write_text(s)
          PY
      - name: Apply C1 review fixes
        run: |
          python scripts/a4-c1-review-fix.py
          python scripts/a4-c1-review-fix-2.py
          python scripts/a4-c1-review-fix-3.py
          python scripts/a4-c1-review-fix-4.py
      - name: C1 canonical session tests
        run: npx vitest run __tests__/components/a4-editor-session.test.ts
      - name: A4 page editor component tests
        run: npx vitest run __tests__/components/a4-page-editor.test.tsx
      - name: A4 toolbar component tests
        run: npx vitest run __tests__/components/a4-editor-toolbar.test.tsx
      - name: A4 editor SSR tests
        run: npx vitest run __tests__/components/a4-page-editor-ssr.test.tsx
      - name: Install browser runtime
        run: npx playwright install chromium
      - name: C1 browser input sequences
        run: npx vitest run --config vitest.browser.config.ts __tests__/browser/a4-input-sequences.browser.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Static stale-authority review
        run: |
          ! grep -n "const liveContent = sanitizeHtml(pageContent.innerHTML)" src/components/documents/a4-page-editor.tsx
          ! grep -n "historyRef" src/components/documents/a4-page-editor.tsx
          ! grep -n "reassemblePageFragments(.*pagesRef.current" src/components/documents/a4-page-editor.tsx
          ! grep -n "textContent = 'Start typed'" __tests__/components/a4-page-editor.test.tsx
          ! grep -n "firstPage.querySelector('p')!.setAttribute('style', 'color: red')" __tests__/components/a4-page-editor.test.tsx
      - name: Commit validated review fixes
        run: |
          rm scripts/a4-c1-review-fix.py
          rm scripts/a4-c1-review-fix-2.py
          rm scripts/a4-c1-review-fix-3.py
          rm scripts/a4-c1-review-fix-4.py
          rm .github/workflows/a4-c1-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "A4Editor C1: close stale DOM and layout history gaps"
          git fetch origin codex/a4-editor-core-c1
          git rebase origin/codex/a4-editor-core-c1
          git push origin HEAD:codex/a4-editor-core-c1