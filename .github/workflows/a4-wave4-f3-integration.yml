name: A4 Wave 4 F3 Integration

on:
  push:
    branches:
      - codex/a4-editor-wave4-integration-20260913

permissions:
  contents: read

jobs:
  validate-f3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/a4-editor-wave4-integration-20260913
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: F3 focused field authoring/discovery
        run: >-
          npx vitest run
          __tests__/components/template-editor/field-authoring.test.ts
          __tests__/components/template-editor/placeholder-panel.test.tsx
          --reporter=verbose
      - name: Field contract/resolver compatibility
        run: >-
          npx vitest run
          __tests__/lib/template-field-contract.test.ts
          __tests__/lib/template-field-f1.test.ts
          __tests__/lib/template-placeholder-storage.test.ts
          __tests__/lib/placeholder-resolver.test.ts
          --reporter=verbose
      - name: Typecheck integrated S3+F3
        run: npm run typecheck
