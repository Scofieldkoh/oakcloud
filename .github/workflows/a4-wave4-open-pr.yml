name: A4 Wave 4 one-shot PR opener

on:
  push:
    branches:
      - codex/a4-editor-wave4-integration-20260913
    paths:
      - docs/plans/2026-09-10-a4-editor-implementation/coordination/wave4-open-pr-trigger.txt

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BODY_B64: ""
    steps:
      - uses: actions/checkout@v6
      - name: Create draft PR if absent
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY_B64" | base64 -d > /tmp/pr-body.md
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head codex/a4-editor-wave4-integration-20260913 --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head codex/a4-editor-wave4-integration-20260913 --title 'A4Editor Wave 4: C3/S3/F3/W3 integration candidate' --body-file /tmp/pr-body.md
