name: Node 24 compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: node24-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24:
    name: Node 24 static and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime major
        run: node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test Chromium path resolution
        run: npm run test:run -- __tests__/lib/chrome-executable.test.ts --reporter=dot

      - name: Build application
        run: npm run build

  docker:
    name: Production image compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          load: true
          tags: oakcloud:node24-ci

      - name: Verify final runtime and Chromium
        run: |
          docker run --rm --entrypoint sh oakcloud:node24-ci -lc '
            node --version | grep -E "^v24\." &&
            test "$CHROME_PATH" = "/usr/local/bin/oakcloud-chromium" &&
            test -x "$CHROME_PATH" &&
            "$CHROME_PATH" --version &&
            npm run test:chromium
          '
