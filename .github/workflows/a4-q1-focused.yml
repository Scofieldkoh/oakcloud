name: A4 Q1 focused verification

on:
  push:
    branches:
      - verify/a4-editor-q1-20260912

permissions:
  contents: read

env:
  CANDIDATE_SHA: 6e8d4426c0d57043d85a830045dee465f6ff9a47

jobs:
  browser_q1_08:
    name: Q1-08 empty nested-list caret
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verifier branch
        uses: actions/checkout@v6
        with:
          path: verify
          persist-credentials: false
      - name: Check out frozen candidate
        uses: actions/checkout@v6
        with:
          ref: 6e8d4426c0d57043d85a830045dee465f6ff9a47
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Prove candidate scope
        run: cd candidate && test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && test -z "$(git status --porcelain)"
      - name: Overlay focused Q1-08 verifier
        run: cp verify/__tests__/browser/a4-q1-08-empty.browser.test.tsx candidate/__tests__/browser/
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install dependencies
        working-directory: candidate
        run: npm ci
      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Execute Q1-08 in real Chromium
        working-directory: candidate
        run: npx vitest run --config vitest.browser.config.ts __tests__/browser/a4-q1-08-empty.browser.test.tsx --reporter=verbose

  output_q1_11:
    name: Q1-11 real HTML and PDF rendering
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out verifier branch
        uses: actions/checkout@v6
        with:
          path: verify
          persist-credentials: false
      - name: Check out frozen candidate
        uses: actions/checkout@v6
        with:
          ref: 6e8d4426c0d57043d85a830045dee465f6ff9a47
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Prove candidate scope
        run: cd candidate && test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" && test -z "$(git status --porcelain)"
      - name: Overlay focused Q1-11 verifier
        run: cp verify/tests/document-output/a4-q1-11-real-render.test.ts candidate/tests/document-output/
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install dependencies
        working-directory: candidate
        run: npm ci
      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Bind production Puppeteer path
        working-directory: candidate
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(node -e \"const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())\")" >> "$GITHUB_ENV"
      - name: Configure evidence directory
        run: echo "Q1_OUTPUT_DIR=${GITHUB_WORKSPACE}/candidate/.q1-artifacts" >> "$GITHUB_ENV"
      - name: Execute Q1-11 real render
        working-directory: candidate
        run: npx vitest run tests/document-output/a4-q1-11-real-render.test.ts --reporter=verbose
      - name: Upload Q1-11 rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-q1-11-real-render
          path: candidate/.q1-artifacts/
          if-no-files-found: warn
          retention-days: 14
