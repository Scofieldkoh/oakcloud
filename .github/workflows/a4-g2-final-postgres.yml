name: A4 G2 final PostgreSQL
on:
  push:
    branches: [codex/a4-editor-g2-prevalidation-20260912]
    paths: [.github/workflows/a4-g2-final-postgres.yml]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: assistant_test
          POSTGRES_DB: business_assistant_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U assistant_test -d business_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://assistant_test@127.0.0.1:55439/business_assistant_test
      BUSINESS_ASSISTANT_TEST_DATABASE_URL: postgresql://assistant_test@127.0.0.1:55439/business_assistant_test
      TEST_DATABASE_URL: postgresql://assistant_test@127.0.0.1:55439/business_assistant_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 07523b105bfd7e32e7916408c7a7e825815d4424
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: node scripts/require-business-assistant-test-env.mjs
      - run: npx prisma migrate deploy
      - name: Run disposable PostgreSQL matrix
        shell: bash
        run: |
          set -u
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          failed=0
          run_suite() { label="$1"; shift; echo "===== SUITE ${label} ====="; set +e; "$@"; code=$?; set -e; echo "===== RESULT ${label} exit=${code} ====="; if [ "$code" -ne 0 ]; then failed=1; fi; }
          run_suite W1_CAS_BATCH npx vitest run __tests__/integration/a4-editor-workflow-w1.postgres.test.ts __tests__/integration/document-generation-batch.postgres.test.ts --maxWorkers=1 --reporter=verbose
          run_suite W2_DRAFTS npx vitest run __tests__/integration/bizfile/a4-workflow-w2-drafts.postgres.test.ts --maxWorkers=1 --reporter=verbose
          run_suite W2_W1_POSTGRES npx vitest run __tests__/integration/bizfile/a4-workflow-w2-w1-postgres-compat.test.ts --maxWorkers=1 --reporter=verbose
          exit "$failed"
