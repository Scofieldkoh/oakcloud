name: A4 Wave 4 closeout materializer

on:
  push:
    branches:
      - codex/a4-editor-wave4-integration-20260913
    paths:
      - docs/plans/2026-09-10-a4-editor-implementation/coordination/wave4-closeout-trigger.txt

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Append closeout records
        shell: bash
        env:
          CORE_APPEND: ""
          DISPATCH_APPEND: ""
          VERIFY_APPEND: ""
        run: |
          set -euo pipefail
          printf '%s' "$CORE_APPEND" | base64 -d >> docs/plans/2026-09-10-a4-editor-implementation/coordination/core.md
          printf '%s' "$DISPATCH_APPEND" | base64 -d >> docs/plans/2026-09-10-a4-editor-implementation/coordination/dispatch.md
          printf '%s' "$VERIFY_APPEND" | base64 -d >> docs/plans/2026-09-10-a4-editor-implementation/coordination/verify.md
      - name: Commit closeout records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/plans/2026-09-10-a4-editor-implementation/coordination/core.md docs/plans/2026-09-10-a4-editor-implementation/coordination/dispatch.md docs/plans/2026-09-10-a4-editor-implementation/coordination/verify.md
          git diff --cached --check
          git commit -m 'docs(a4): publish Wave 4 closeout and Q2 G4 handoff'
          git push origin HEAD:codex/a4-editor-wave4-integration-20260913
