name: A4 C1 editor integration patch

on:
  push:
    branches:
      - codex/a4-editor-core-c1

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/a4-editor-core-c1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply C1 editor integration patch
        run: |
          python scripts/a4-c1-editor-patch.py
          python scripts/a4-c1-editor-patch-fix.py
      - name: Focused C1 session tests
        run: npx vitest run __tests__/components/a4-editor-session.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit verified integration patch
        run: |
          rm scripts/a4-c1-editor-patch.py
          rm scripts/a4-c1-editor-patch-fix.py
          rm .github/workflows/a4-c1-editor-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "A4Editor C1: wire canonical session into editor input path"
          git push origin HEAD:codex/a4-editor-core-c1
