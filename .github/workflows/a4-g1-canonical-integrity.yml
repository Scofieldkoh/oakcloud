name: A4 G1 canonical integrity

on:
  push:
    branches:
      - codex/a4-editor-g1-verification
    paths:
      - .github/workflows/a4-g1-canonical-integrity.yml

permissions:
  contents: read

concurrency:
  group: a4-g1-canonical-integrity
  cancel-in-progress: false

env:
  G1_INTEGRATION_SHA: 603f3a25d168435b56709ef9c2c2e8cdda9af737

jobs:
  canonical-and-compatibility:
    name: G1 canonical, structural, F1 and W1 focused suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://oakcloud:oakcloud_password@127.0.0.1:5432/oakcloud
      JWT_SECRET: g1-ci-only-build-secret-that-is-not-used-at-runtime
      ENCRYPTION_KEY: g1-ci-only-build-encryption-key
    steps:
      - name: Check out exact Stage-1 integration commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.G1_INTEGRATION_SHA }}
          fetch-depth: 0
      - name: Assert exact G1 source commit
        run: test "$(git rev-parse HEAD)" = "$G1_INTEGRATION_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify runtime major
        run: node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run C1 canonical session and editor regressions
        run: >-
          npx vitest run
          __tests__/components/a4-editor-session.test.ts
          __tests__/components/a4-page-editor.test.tsx
          __tests__/components/a4-editor-toolbar.test.tsx
          __tests__/components/a4-page-editor-ssr.test.tsx
          --reporter=verbose
      - name: Run S1 structural and pagination regressions
        run: npx vitest run __tests__/components/a4-pagination --reporter=verbose
      - name: Run F1 field and C05/C06 compatibility smoke
        run: >-
          npx vitest run
          __tests__/lib/template-field-contract.test.ts
          __tests__/lib/template-field-f0-compatibility.test.ts
          __tests__/lib/template-field-f1.test.ts
          __tests__/lib/a4-content-policy.test.ts
          __tests__/lib/a4-content-policy-f1.test.ts
          __tests__/lib/template-placeholder-storage.test.ts
          __tests__/lib/template-analysis.test.ts
          __tests__/lib/placeholder-resolver.test.ts
          __tests__/lib/document-generation-master-fields.test.ts
          --reporter=verbose
      - name: Run W1 reader, sanitizer, save and output compatibility smoke
        run: >-
          npx vitest run
          tests/lib/a4-editor-capabilities-w1.test.ts
          tests/lib/a4-editor-producer-integration-w1.test.ts
          tests/lib/a4-editor-server-reader-w1.test.ts
          tests/services/document-export-w1.test.ts
          tests/services/document-template-editor-save.test.ts
          tests/services/document-template-editor-fields.test.ts
          tests/services/document-template-editor-drafts.test.ts
          tests/document-output/document-template-editor-output.test.ts
          --reporter=verbose

  browser-boundaries:
    name: G1 native input and structural browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Stage-1 integration commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.G1_INTEGRATION_SHA }}
          fetch-depth: 0
      - name: Assert exact G1 source commit
        run: test "$(git rev-parse HEAD)" = "$G1_INTEGRATION_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run canonical native-input and structural boundary browser suites
        run: >-
          npx vitest run --config vitest.browser.config.ts
          __tests__/browser/a4-input-sequences.browser.test.tsx
          __tests__/browser/a4-boundary-semantics.browser.test.tsx
          __tests__/browser/a4-page-editor.browser.test.tsx
          --reporter=verbose

  generated-document-revisions:
    name: G1 GeneratedDocument revision plumbing smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g1_test
          POSTGRES_PASSWORD: g1-test-only
          POSTGRES_DB: oakcloud_g1
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U g1_test -d oakcloud_g1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://g1_test:g1-test-only@127.0.0.1:55440/oakcloud_g1
      TEST_DATABASE_URL: postgresql://g1_test:g1-test-only@127.0.0.1:55440/oakcloud_g1
    steps:
      - name: Check out exact Stage-1 integration commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.G1_INTEGRATION_SHA }}
          fetch-depth: 0
      - name: Assert exact G1 source commit
        run: test "$(git rev-parse HEAD)" = "$G1_INTEGRATION_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Run W1 revision and batch isolation regressions
        run: >-
          npx vitest run
          __tests__/integration/a4-editor-workflow-w1.postgres.test.ts
          __tests__/integration/document-generation-batch.postgres.test.ts
          --maxWorkers=1
          --reporter=verbose

  bundle-and-build:
    name: G1 bundle freshness, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://oakcloud:oakcloud_password@127.0.0.1:5432/oakcloud
      JWT_SECRET: g1-ci-only-build-secret-that-is-not-used-at-runtime
      ENCRYPTION_KEY: g1-ci-only-build-encryption-key
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out exact Stage-1 integration commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.G1_INTEGRATION_SHA }}
          fetch-depth: 0
      - name: Assert exact G1 source commit
        run: test "$(git rev-parse HEAD)" = "$G1_INTEGRATION_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify pagination bundle contract marker
        run: grep -q 'w1-s1-structural-v1' src/components/documents/a4-pagination/pagination-bundle.generated.ts
      - name: Regenerate pagination bundle
        run: npm run generate:pagination-bundle
      - name: Verify committed pagination bundle is fresh
        run: git diff --exit-code -- src/components/documents/a4-pagination/pagination-bundle.generated.ts
      - name: Lint
        run: npm run lint
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Repository typecheck
        run: npm run typecheck
      - name: Project-reference typecheck
        run: npx tsc -b
      - name: Build application
        run: npm run build
