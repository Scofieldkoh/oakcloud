name: A4 Wave 4 C3 finalize v2

on:
  push:
    branches:
      - codex/a4-editor-wave4-integration-20260913

permissions:
  contents: write

concurrency:
  group: a4-wave4-c3-finalize-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://oakcloud:oakcloud_password@127.0.0.1:5432/oakcloud
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply CORE C3 integration
        run: |
          if ! grep -q "type A4WorkflowStatus" src/components/documents/a4-page-editor.tsx; then
            node scripts/a4-c3-finalize.mjs
          fi
          if ! grep -q "shared ready output surface" __tests__/components/a4-page-editor.test.tsx; then
            node scripts/a4-c3-adjust-tests.mjs
          fi
      - name: Regenerate pagination bundle
        run: npm run generate:pagination-bundle
      - name: Run focused compatibility
        run: >-
          npx vitest run
          __tests__/components/a4-editor-c3-accessibility.test.tsx
          __tests__/components/a4-editor-toolbar.test.tsx
          __tests__/components/a4-page-editor.test.tsx
          __tests__/lib/a4-workflow-w3.test.ts
          tests/services/document-export-w1.test.ts
          --reporter=dot
      - run: npm run typecheck
      - name: Commit verified integration delta
        run: |
          if git diff --quiet; then
            echo "No integration delta"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/documents/a4-page-editor.tsx __tests__/components/a4-editor-c3-accessibility.test.tsx __tests__/components/a4-page-editor.test.tsx src/components/documents/a4-pagination/pagination-bundle.generated.ts
            git commit -m "feat(a4): complete C3 Wave 4 consumer wiring"
            git push
          fi
