name: A4 Wave 4 G3 independent verification

on:
  workflow_dispatch:
  push:
    branches:
      - verify/a4-wave4-q2-g4-20260914
    paths:
      - '.github/workflows/a4-wave4-g3-verify.yml'

permissions:
  contents: read

concurrency:
  group: a4-wave4-g3-independent-verification
  cancel-in-progress: true

jobs:
  g3-static-browser-output:
    name: G3 static, browser, and actual output
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://oakcloud:oakcloud_password@127.0.0.1:5432/oakcloud
      JWT_SECRET: ci-only-build-secret-that-is-not-used-at-runtime-and-is-long-enough
      ENCRYPTION_KEY: ci-only-build-encryption-key
      G3_ARTIFACT_DIR: artifacts/a4-wave4-g3
    steps:
      - name: Check out frozen product candidate
        uses: actions/checkout@v6
        with:
          ref: b522cf50f61f18b75f2cae62b42cd142bef4cf2d
          fetch-depth: 0
      - name: Assert exact frozen SHA
        run: |
          test "$(git rev-parse HEAD)" = "b522cf50f61f18b75f2cae62b42cd142bef4cf2d"
          git rev-parse HEAD
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium and expose executable
        run: |
          npx playwright install chromium --with-deps
          echo "CHROME_PATH=$(node -e \"console.log(require('playwright').chromium.executablePath())\")" >> "$GITHUB_ENV"
      - name: Regenerate A4 pagination bundle and require clean tree
        run: |
          npm run generate:pagination-bundle
          git diff --exit-code -- src/components/documents/a4-pagination/pagination-bundle.generated.ts
      - name: Typecheck
        run: npm run typecheck
      - name: G3 field grammar and authoring lifecycle
        run: >-
          npx vitest run
          __tests__/components/template-editor/field-authoring.test.ts
          __tests__/components/template-editor/placeholder-panel.test.tsx
          __tests__/lib/template-field-contract.test.ts
          __tests__/lib/template-field-f1.test.ts
          __tests__/lib/template-placeholder-storage.test.ts
          __tests__/lib/placeholder-resolver.test.ts
          --reporter=dot
      - name: G3 workflow and output lifecycle
        run: >-
          npx vitest run
          __tests__/lib/a4-workflow-w3.test.ts
          __tests__/services/a4-w3-synthetic-generation.test.ts
          __tests__/services/scoped-template-field-renderer.test.ts
          tests/services/document-export-w1.test.ts
          --reporter=dot
      - name: Prior-gate Chromium regression
        run: >-
          npx vitest run --config vitest.browser.config.ts
          __tests__/browser/a4-page-editor.browser.test.tsx
          __tests__/browser/a4-input-sequences.browser.test.tsx
          __tests__/browser/a4-s3-performance.browser.test.tsx
          __tests__/browser/a4-boundary-semantics.browser.test.tsx
          --reporter=dot
      - name: Fetch temporary verifier material
        run: git fetch origin verify/a4-wave4-q2-g4-20260914:refs/remotes/origin/verify/a4-wave4-q2-g4-20260914
      - name: Materialize verifier-only actual-output test
        run: |
          git show origin/verify/a4-wave4-q2-g4-20260914:verification/a4-wave4-g3-actual-output.verify.test.ts > __tests__/services/a4-wave4-g3-actual-output.verify.test.ts
      - name: Actual HTML and PDF output through Chromium
        run: npx vitest run __tests__/services/a4-wave4-g3-actual-output.verify.test.ts --reporter=dot
      - name: Upload G3 output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-wave4-g3-output-evidence
          path: artifacts/a4-wave4-g3
          if-no-files-found: warn
          retention-days: 14

  g3-postgres:
    name: G3 disposable PostgreSQL revisions and concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: a4_verify
          POSTGRES_PASSWORD: a4-verify-only
          POSTGRES_DB: a4_wave4_verify
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U a4_verify -d a4_wave4_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://a4_verify:a4-verify-only@127.0.0.1:55441/a4_wave4_verify
      TEST_DATABASE_URL: postgresql://a4_verify:a4-verify-only@127.0.0.1:55441/a4_wave4_verify
    steps:
      - name: Check out frozen product candidate
        uses: actions/checkout@v6
        with:
          ref: b522cf50f61f18b75f2cae62b42cd142bef4cf2d
          fetch-depth: 0
      - name: Assert exact frozen SHA
        run: |
          test "$(git rev-parse HEAD)" = "b522cf50f61f18b75f2cae62b42cd142bef4cf2d"
          git rev-parse HEAD
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations to disposable database
        run: npx prisma migrate deploy
      - name: G3 revision, draft, compatibility, and concurrency acceptance
        run: >-
          npx vitest run
          __tests__/integration/a4-editor-workflow-w1.postgres.test.ts
          __tests__/integration/a4-editor-q1-persistence.test.ts
          --maxWorkers=1 --reporter=dot
