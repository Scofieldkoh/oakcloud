name: A4 G2 corrective validation v3

on:
  push:
    branches:
      - codex/a4-editor-wave2-g2-integration-20260912

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://localhost/oakcloud
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/a4-editor-wave2-g2-integration-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Reapply validated v2 corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/a4-g2-correction-v2.yml').read_text()
          start_marker = "      - name: Apply G2 corrections\n        shell: bash\n        run: |\n"
          end_marker = "      - name: S2 focused regression\n"
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/a4-g2-v2-apply.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/a4-g2-v2-apply.sh
      - name: Correct active list toggle mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/documents/a4-page-editor.tsx')
          text = path.read_text()
          old = """        if (command.type === 'list') {
          const listType = command.value;
          if (listType === 'none') {
            applyCurrentSemanticCommand({ type: 'clear-list-type' });
          } else {
            applyCurrentSemanticCommand({ type: 'set-list-type', listType });
          }
          return;
        }
"""
          new = """        if (command.type === 'list') {
          const listType = command.value;
          const surface = documentSurfaceRef.current;
          if (!surface) return;
          if (!selectionIsWithinPageContents(surface) && !restoreSelection()) return;
          const bookmark = captureFlowSelection(surface);
          if (!bookmark) return;
          const currentList = readLogicalFormatState(
            surface,
            bookmark,
            effectiveLayout,
          ).list;
          if (listType === 'none' || currentList === listType) {
            applyCurrentSemanticCommand({ type: 'clear-list-type' });
          } else {
            applyCurrentSemanticCommand({ type: 'set-list-type', listType });
          }
          return;
        }
"""
          if old not in text:
              raise SystemExit('list command mapping marker missing')
          text = text.replace(old, new, 1)
          old_deps = """      [applyCurrentS2NestToggle, applyCurrentSemanticCommand, applySelectionTransaction, handleCommand],
"""
          new_deps = """      [
        applyCurrentS2NestToggle,
        applyCurrentSemanticCommand,
        applySelectionTransaction,
        effectiveLayout,
        handleCommand,
        restoreSelection,
      ],
"""
          if old_deps not in text:
              raise SystemExit('toolbar callback dependency marker missing')
          path.write_text(text.replace(old_deps, new_deps, 1))
          PY
      - name: S2 focused regression
        run: >-
          npx vitest run
          __tests__/components/a4-pagination/s2-semantics.test.ts
          __tests__/components/a4-pagination/s2-list-formatting-regressions.test.ts
          __tests__/components/a4-pagination/structural-position.test.ts
          __tests__/components/a4-pagination/structural-commands.test.ts
          __tests__/components/a4-pagination/semantic-break-projection.test.ts
          __tests__/components/a4-pagination/formatting.test.ts
          --reporter=verbose
      - name: CORE focused regression
        run: >-
          npx vitest run
          __tests__/components/a4-editor-c2-bridge.test.ts
          __tests__/components/a4-editor-session.test.ts
          __tests__/components/a4-page-editor.test.tsx
          __tests__/components/a4-editor-toolbar.test.tsx
          __tests__/components/a4-page-editor-ssr.test.tsx
          --reporter=verbose
      - name: W1 source-contract correction
        run: >-
          npx vitest run
          tests/services/document-template-editor-save.test.ts
          tests/services/document-template-editor-drafts.test.ts
          --reporter=verbose
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: S2 browser boundary
        run: >-
          npx vitest run --config vitest.browser.config.ts
          __tests__/browser/a4-boundary-semantics.browser.test.tsx
          --reporter=verbose
      - name: Integrated page editor browser
        run: >-
          npx vitest run --config vitest.browser.config.ts
          __tests__/browser/a4-page-editor.browser.test.tsx
          --reporter=verbose
      - name: Static gates
        run: |
          npm run generate:pagination-bundle
          git diff --exit-code -- src/components/documents/a4-pagination/pagination-bundle.generated.ts
          npm run lint
          npm run typecheck
          npx tsc -b
          npm run build
      - name: Commit validated corrections
        shell: bash
        run: |
          git config user.name "ChatGPT CORE Integrator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git rm .github/workflows/a4-g2-correction.yml .github/workflows/a4-g2-correction-v2.yml .github/workflows/a4-g2-correction-v3.yml
          git commit -m "fix(a4): resolve G2 integration blockers"
          git push origin HEAD:codex/a4-editor-wave2-g2-integration-20260912
