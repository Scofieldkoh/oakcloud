name: A4 C1 G1 corrective validation

on:
  push:
    branches:
      - codex/a4-editor-core-c1-g1-correction

permissions:
  contents: write

jobs:
  corrective:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply narrow C1 correction
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/components/documents/a4-page-editor.tsx')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, got {n}')
              s = s.replace(old, new, 1)

          once(
              '  type A4EditorSnapshot,\n  type CanonicalEditorIntentKind,',
              '  type A4EditorSnapshot,\n  type A4ProjectionRevision,\n  type CanonicalEditorIntentKind,',
              'projection revision import',
          )

          once(
              '    const reflowGenerationRef = useRef(0);\n    const [isReflowing, setIsReflowing] = useState(false);',
              '    const reflowGenerationRef = useRef(0);\n    const pendingProjectionPublicationRef = useRef<A4ProjectionRevision | null>(null);\n    const [isReflowing, setIsReflowing] = useState(false);',
              'pending projection publication ref',
          )

          # Map native mouse points to the closest text boundary using the same rendered
          # prefix geometry the browser test/user sees, without deriving canonical content.
          marker = '''function selectionSpansPages(root: HTMLElement): boolean {
            const selection = window.getSelection();
            if (!selection || selection.isCollapsed) return false;
            const { anchor, focus } = selectionPageContents(root);
            return Boolean(
              anchor?.dataset.pageId &&
                focus?.dataset.pageId &&
                anchor.dataset.pageId !== focus.dataset.pageId,
            );
          }

          function selectionStartPoint('''
          helper = '''function selectionSpansPages(root: HTMLElement): boolean {
            const selection = window.getSelection();
            if (!selection || selection.isCollapsed) return false;
            const { anchor, focus } = selectionPageContents(root);
            return Boolean(
              anchor?.dataset.pageId &&
                focus?.dataset.pageId &&
                anchor.dataset.pageId !== focus.dataset.pageId,
            );
          }

          interface NativeSelectionDragPoint {
            node: Node;
            offset: number;
            pageContent: HTMLElement;
          }

          function nativeSelectionPointAtClientPosition(
            root: HTMLElement,
            clientX: number,
            clientY: number,
          ): NativeSelectionDragPoint | null {
            const ownerDocument = root.ownerDocument as Document & {
              caretPositionFromPoint?: (
                x: number,
                y: number,
              ) => { offsetNode: Node; offset: number } | null;
              caretRangeFromPoint?: (x: number, y: number) => Range | null;
            };
            const position = ownerDocument.caretPositionFromPoint?.(clientX, clientY);
            const fallback = position
              ? null
              : ownerDocument.caretRangeFromPoint?.(clientX, clientY) ?? null;
            const node = position?.offsetNode ?? fallback?.startContainer ?? null;
            const nativeOffset = position?.offset ?? fallback?.startOffset ?? 0;
            if (!node || !root.contains(node)) return null;
            const pageContent = pageContentContainingNode(root, node);
            if (!pageContent) return null;
            if (node.nodeType !== Node.TEXT_NODE) {
              return { node, offset: nativeOffset, pageContent };
            }

            const textNode = node as Text;
            if (textNode.length === 0) return { node, offset: 0, pageContent };
            let bestOffset = Math.min(Math.max(nativeOffset, 0), textNode.length);
            let bestScore = Number.POSITIVE_INFINITY;
            for (let candidate = 0; candidate <= textNode.length; candidate += 1) {
              let boundaryX: number;
              let boundaryY: number;
              if (candidate === 0) {
                const first = ownerDocument.createRange();
                first.setStart(textNode, 0);
                first.setEnd(textNode, Math.min(1, textNode.length));
                const rect = first.getClientRects()[0] ?? first.getBoundingClientRect();
                boundaryX = rect.left;
                boundaryY = rect.top + rect.height / 2;
              } else {
                const prefix = ownerDocument.createRange();
                prefix.setStart(textNode, 0);
                prefix.setEnd(textNode, candidate);
                const rects = prefix.getClientRects();
                const rect = rects[rects.length - 1] ?? prefix.getBoundingClientRect();
                boundaryX = rect.right - 1;
                boundaryY = rect.top + rect.height / 2;
              }
              const dx = boundaryX - clientX;
              const dy = boundaryY - clientY;
              const score = dx * dx + dy * dy * 16;
              if (score < bestScore) {
                bestScore = score;
                bestOffset = candidate;
              }
            }
            return { node: textNode, offset: bestOffset, pageContent };
          }

          function selectionStartPoint('''
          once(marker, helper, 'native selection point helper')
          once(
              '    const tableResizeRef = useRef<TableResizeSession | null>(null);\n    const tableResizeHoverRef = useRef<{',
              '    const tableResizeRef = useRef<TableResizeSession | null>(null);\n    const nativeSelectionDragStartRef = useRef<NativeSelectionDragPoint | null>(null);\n    const tableResizeHoverRef = useRef<{',
              'native selection drag ref',
          )

          # Session-backed reflow leaves the last committed pages mounted. It validates the
          # canonical revision before rendering and publishes revision identity only after
          # React has committed the matching DOM.
          once(
              '        pagesRef.current = sourcePages;\n        reflowGenerationRef.current += 1;',
              '        if (!session) {\n          pagesRef.current = sourcePages;\n        }\n        reflowGenerationRef.current += 1;',
              'retain committed session projection',
          )
          once(
              '''              if (
                        session &&
                        projectionRevision &&
                        !session.publishProjection(projectionRevision)
                      ) {
                        return;
                      }

                      const nextPages = fragments.map''',
              '''              if (session && projectionRevision) {
                        const current = session.getState();
                        if (
                          projectionRevision.sessionKey !== current.sessionKey ||
                          projectionRevision.documentRevision !== current.revision ||
                          projectionRevision.layoutRevision !== current.layoutRevision ||
                          projectionRevision.fontRevision !== current.fontRevision
                        ) {
                          return;
                        }
                      }

                      const nextPages = fragments.map''',
              'pre-render stale projection validation',
          )
          once(
              '''              pagesRef.current = nextPages;
                      if (!session) {''',
              '''              pagesRef.current = nextPages;
                      if (session && projectionRevision) {
                        pendingProjectionPublicationRef.current = projectionRevision;
                      }
                      if (!session) {''',
              'queue DOM-committed projection publication',
          )

          # Publish only after pages are actually mounted. Restore a canonical logical
          # bookmark first so a same-revision keyboard event cannot observe stale DOM caret.
          anchor = '''    useEffect(() => {
              const canonicalValue = sanitizeHtml('''
          effect = '''    useLayoutEffect(() => {
              const revision = pendingProjectionPublicationRef.current;
              if (!revision) return;
              const session = canonicalSessionRef.current;
              if (!session || session.getState().sessionKey !== revision.sessionKey) {
                pendingProjectionPublicationRef.current = null;
                return;
              }

              const bookmark = pendingFlowSelectionRef.current;
              const root = documentSurfaceRef.current;
              if (bookmark && root && restoreFlowSelection(root, bookmark)) {
                savedSelectionRef.current = captureFlowSelection(root) ?? bookmark;
                pendingSelectionFlowIdRef.current = bookmark.anchor.flowId;
                pendingFlowSelectionRef.current = null;
              }
              session.publishProjection(revision);
              pendingProjectionPublicationRef.current = null;
            }, [pages]);

    useEffect(() => {
              const canonicalValue = sanitizeHtml('''
          once(anchor, effect, 'post-DOM projection publication effect')

          # Soft canonical user edits queue reflow without replacing the committed projection.
          # Hard-page add/delete may publish their deterministic hard-section parse immediately.
          once(
              '''        result: DocumentTransactionResult,
                  intentKind: CanonicalEditorIntentKind = 'structural',
                ) => {''',
              '''        result: DocumentTransactionResult,
                  intentKind: CanonicalEditorIntentKind = 'structural',
                  publishParsedProjection = false,
                ) => {''',
              'commit projection policy',
          )
          once(
              '''        pendingFlowSelectionRef.current = committed.selection;
                  const nextPages = parsePages(session.getState().internalHtml, pagesRef.current);
                  pagesRef.current = nextPages;
                  setPages(nextPages);
                  scheduleReflow(nextPages, false);''',
              '''        pendingFlowSelectionRef.current = committed.selection;
                  const nextPages = parsePages(session.getState().internalHtml, pagesRef.current);
                  if (publishParsedProjection) {
                    pagesRef.current = nextPages;
                    setPages(nextPages);
                  }
                  scheduleReflow(nextPages, false);''',
              'defer soft parsed projection',
          )
          once(
              '      commitUserTransaction(appendHardPage(canonicalPagesHtml(pagesRef.current)));',
              "      commitUserTransaction(appendHardPage(canonicalPagesHtml(pagesRef.current)), 'structural', true);",
              'hard page add projection',
          )
          once(
              '''        commitUserTransaction(
                    deleteHardPageSection(
                      canonicalPagesHtml(currentPages),
                      sectionIndex,
                    ),
                  );''',
              '''        commitUserTransaction(
                    deleteHardPageSection(
                      canonicalPagesHtml(currentPages),
                      sectionIndex,
                    ),
                    'structural',
                    true,
                  );''',
              'hard page delete projection',
          )

          # An unpaired input is repaired from canonical authority without collapsing the
          # committed projection; preserve only a revision-validated logical bookmark.
          once(
              '''        if (session) {
                    const nextPages = parsePages(session.getState().internalHtml, pagesRef.current);
                    pagesRef.current = nextPages;
                    setPages(nextPages);
                    setSurfaceRepairGeneration((generation) => generation + 1);
                    return;
                  }
                  commitDocumentSurface();''',
              '''        if (session) {
                    if (!pendingFlowSelectionRef.current) {
                      const surface = documentSurfaceRef.current;
                      const renderedSelection = surface ? captureFlowSelection(surface) : null;
                      if (renderedSelection) {
                        const target = session.resolveNativeInputTarget({
                          renderedRevision: session.getRenderedProjection().documentRevision,
                          origin: 'pointer',
                          renderedSelection,
                        });
                        if (target.ok && target.selection) {
                          pendingFlowSelectionRef.current = target.selection;
                          session.updateSelection(target.selection);
                        }
                      }
                    }
                    setSurfaceRepairGeneration((generation) => generation + 1);
                    return;
                  }
                  commitDocumentSurface();''',
              'canonical unpaired input repair',
          )

          # Capture exact browser pointer endpoints only for native text selection, never table resize.
          once(
              '''        const target = getTableColumnResizeTarget(
                  documentSurfaceRef.current ?? event.currentTarget,
                  event.target,
                  event.clientX,
                );
                if (!target) return;

                event.preventDefault();''',
              '''        const surface = documentSurfaceRef.current ?? event.currentTarget;
                const target = getTableColumnResizeTarget(
                  surface,
                  event.target,
                  event.clientX,
                );
                if (!target) {
                  nativeSelectionDragStartRef.current = nativeSelectionPointAtClientPosition(
                    surface,
                    event.clientX,
                    event.clientY,
                  );
                  return;
                }
                nativeSelectionDragStartRef.current = null;

                event.preventDefault();''',
              'native pointer selection start',
          )
          once(
              '''            onMouseUp={(event) => {
                        if (!effectivePreviewMode) {
                          syncActivePage(event.target);
                          syncFormattingFromSelection();
                        }
                      }}''',
              '''            onMouseUp={(event) => {
                        if (!effectivePreviewMode) {
                          const dragStart = nativeSelectionDragStartRef.current;
                          nativeSelectionDragStartRef.current = null;
                          const dragEnd = dragStart
                            ? nativeSelectionPointAtClientPosition(
                                event.currentTarget,
                                event.clientX,
                                event.clientY,
                              )
                            : null;
                          if (dragStart && dragEnd && dragStart.pageContent !== dragEnd.pageContent) {
                            window.getSelection()?.setBaseAndExtent(
                              dragStart.node,
                              dragStart.offset,
                              dragEnd.node,
                              dragEnd.offset,
                            );
                          }
                          syncActivePage(event.target);
                          syncFormattingFromSelection();
                        }
                      }}''',
              'native cross-page selection end',
          )

          p.write_text(s)
          PY
          git diff --check
          git diff --stat
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser validation
        run: npx vitest run --config vitest.browser.config.ts __tests__/browser/a4-input-sequences.browser.test.tsx __tests__/browser/a4-boundary-semantics.browser.test.tsx __tests__/browser/a4-page-editor.browser.test.tsx --reporter=verbose
      - name: Component validation
        run: npx vitest run __tests__/components/a4-editor-session.test.ts __tests__/components/a4-page-editor.test.tsx __tests__/components/a4-editor-toolbar.test.tsx __tests__/components/a4-page-editor-ssr.test.tsx --reporter=verbose
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit validated corrective source
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a4-c1-g1-corrective-validation.yml
          git add src/components/documents/a4-page-editor.tsx
          git commit -m "fix(a4-editor): correct C1 G1 projection routing"
          git push origin HEAD:codex/a4-editor-core-c1-g1-correction
