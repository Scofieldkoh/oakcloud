name: A4 C1 G1 corrective validation

on:
  push:
    branches:
      - codex/a4-editor-core-c1-g1-correction

permissions:
  contents: write

jobs:
  corrective:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply C1 corrective patch
        run: python3 .github/scripts/a4-c1-g1-correction.py
      - name: Review patch integrity
        run: |
          git diff --check
          git diff --stat
          git diff -- src/components/documents/a4-page-editor.tsx
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact C1 G1 browser validation
        run: >-
          npx vitest run --config vitest.browser.config.ts
          __tests__/browser/a4-input-sequences.browser.test.tsx
          __tests__/browser/a4-boundary-semantics.browser.test.tsx
          __tests__/browser/a4-page-editor.browser.test.tsx
          --reporter=verbose
      - name: Run exact C1 component/session validation
        run: >-
          npx vitest run
          __tests__/components/a4-editor-session.test.ts
          __tests__/components/a4-page-editor.test.tsx
          __tests__/components/a4-editor-toolbar.test.tsx
          __tests__/components/a4-page-editor-ssr.test.tsx
          --reporter=verbose
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit validated C1 corrective source
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/a4-c1-g1-corrective-validation.yml
          git rm .github/scripts/a4-c1-g1-correction.py
          git add src/components/documents/a4-page-editor.tsx
          git commit -m "fix(a4-editor): correct C1 G1 projection routing"
          git push origin HEAD:codex/a4-editor-core-c1-g1-correction
