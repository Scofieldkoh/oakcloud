name: A4 Q1-11 corrective owner verification

on:
  push:
    branches:
      - verify/q1-11-corrective-owner-20260912

permissions:
  contents: read

env:
  CANDIDATE_SHA: b8d5f80f8a5dc592aa6ce73fa6ff7f3009e21001
  VERIFY_SHA: 0e56b7fe95a914488bd9246e5bb008c8557c65df

jobs:
  q1_11_owner:
    name: Q1-11 corrective owner real render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - name: Check out exact corrective candidate
        uses: actions/checkout@v6
        with:
          ref: b8d5f80f8a5dc592aa6ce73fa6ff7f3009e21001
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Check out authoritative VERIFY fixture
        uses: actions/checkout@v6
        with:
          ref: 0e56b7fe95a914488bd9246e5bb008c8557c65df
          path: verify
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact candidate and verifier scope
        run: |
          cd candidate
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          cd ../verify
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - name: Overlay authoritative independent Q1-11 fixture under a distinct owner-run name
        run: cp verify/tests/document-output/a4-q1-11-real-render.test.ts candidate/tests/document-output/a4-q1-11-independent-owner-rerun.test.ts
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install dependencies
        working-directory: candidate
        run: npm ci
      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Bind production Puppeteer path
        working-directory: candidate
        run: |
          CHROME_PATH=$(node -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')
          echo "PUPPETEER_EXECUTABLE_PATH=${CHROME_PATH}" >> "$GITHUB_ENV"
      - name: Configure rendered evidence directory
        run: echo "Q1_OUTPUT_DIR=${GITHUB_WORKSPACE}/candidate/q1-artifacts" >> "$GITHUB_ENV"
      - name: Run print-style owner unit regression
        working-directory: candidate
        run: npx vitest run __tests__/components/a4-print-styles.test.ts --reporter=verbose
      - name: Run corrective owner Q1-11 real HTML/PDF regression
        working-directory: candidate
        run: npx vitest run tests/document-output/a4-q1-11-ordered-list-output.test.ts --reporter=verbose
      - name: Run authoritative independent Q1-11 fixture as owner evidence only
        working-directory: candidate
        run: npx vitest run tests/document-output/a4-q1-11-independent-owner-rerun.test.ts --reporter=verbose
      - name: Upload corrective rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-q1-11-corrective-owner-render
          path: candidate/q1-artifacts/
          if-no-files-found: warn
          retention-days: 14
