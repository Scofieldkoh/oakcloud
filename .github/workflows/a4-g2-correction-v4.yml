name: A4 G2 corrective validation v4

on:
  push:
    branches:
      - codex/a4-editor-wave2-g2-integration-20260912

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: "postgresql://localhost/oakcloud"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/a4-editor-wave2-g2-integration-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Apply G2 corrections
        run: python scripts/a4-g2-corrective.py
      - name: S2 focused regression
        run: npx vitest run __tests__/components/a4-pagination/s2-semantics.test.ts __tests__/components/a4-pagination/s2-list-formatting-regressions.test.ts __tests__/components/a4-pagination/structural-position.test.ts __tests__/components/a4-pagination/structural-commands.test.ts __tests__/components/a4-pagination/semantic-break-projection.test.ts __tests__/components/a4-pagination/formatting.test.ts --reporter=verbose
      - name: CORE focused regression
        run: npx vitest run __tests__/components/a4-editor-c2-bridge.test.ts __tests__/components/a4-editor-session.test.ts __tests__/components/a4-page-editor.test.tsx __tests__/components/a4-editor-toolbar.test.tsx __tests__/components/a4-page-editor-ssr.test.tsx --reporter=verbose
      - name: W1 source-contract correction
        run: npx vitest run tests/services/document-template-editor-save.test.ts tests/services/document-template-editor-drafts.test.ts --reporter=verbose
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: S2 browser boundary
        run: npx vitest run --config vitest.browser.config.ts __tests__/browser/a4-boundary-semantics.browser.test.tsx --reporter=verbose
      - name: Integrated page editor browser
        run: npx vitest run --config vitest.browser.config.ts __tests__/browser/a4-page-editor.browser.test.tsx --reporter=verbose
      - name: Static gates
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run generate:pagination-bundle
          git diff --exit-code -- src/components/documents/a4-pagination/pagination-bundle.generated.ts
          npm run lint
          npm run typecheck
          npx tsc -b
          npm run build
      - name: Commit validated corrections
        shell: bash
        run: |
          git config user.name "ChatGPT CORE Integrator"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git rm .github/workflows/a4-g2-correction.yml .github/workflows/a4-g2-correction-v2.yml .github/workflows/a4-g2-correction-v3.yml .github/workflows/a4-g2-correction-v4.yml scripts/a4-g2-corrective.py
          git commit -m "fix(a4): resolve G2 integration blockers"
          git push origin HEAD:codex/a4-editor-wave2-g2-integration-20260912
