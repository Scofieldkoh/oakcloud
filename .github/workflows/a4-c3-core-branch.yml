name: A4 C3 Core Branch

on:
  push:
    branches:
      - codex/a4-editor-core-c3-20260913

permissions:
  contents: write

jobs:
  diagnose-browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/a4-editor-core-c3-20260913
      - name: Apply C3 patch
        run: |
          python3 scripts/a4-c3-apply-patch.py
          python3 scripts/a4-c3-update-page-number-test.py
          python3 scripts/a4-c3-update-interactions.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture browser results
        shell: bash
        run: |
          set +e
          : > a4-c3-browser-exits.txt
          i=0
          for f in \
            __tests__/browser/a4-page-editor.browser.test.tsx \
            __tests__/browser/a4-q1-acceptance.browser.test.tsx \
            __tests__/browser/a4-input-sequences.browser.test.tsx
          do
            i=$((i+1))
            out="a4-c3-browser-$i.json"
            npx vitest run --config vitest.browser.config.ts "$f" --reporter=json --outputFile="$out"
            code=$?
            echo "$f=$code" >> a4-c3-browser-exits.txt
          done
          cat a4-c3-browser-exits.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f a4-c3-browser-exits.txt a4-c3-browser-*.json
          git commit -m "test(a4): capture C3 browser diagnostic"
          git push origin HEAD:codex/a4-editor-core-c3-20260913
          exit 0
