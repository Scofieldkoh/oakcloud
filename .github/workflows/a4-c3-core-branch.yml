name: A4 C3 Core Branch

on:
  push:
    branches:
      - codex/a4-editor-core-c3-20260913

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/a4-editor-core-c3-20260913

      - name: Apply deterministic C3 source patch
        run: |
          python3 scripts/a4-c3-apply-patch.py
          python3 scripts/a4-c3-update-page-number-test.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Focused C3 components
        id: focused
        shell: bash
        run: |
          set +e
          npx vitest run \
            __tests__/components/a4-editor-toolbar.test.tsx \
            __tests__/components/a4-editor-c3-accessibility.test.tsx \
            __tests__/components/a4-page-editor.test.tsx \
            __tests__/components/a4-editor-session.test.ts \
            --reporter=verbose > a4-c3-focused.log 2>&1
          code=$?
          cat a4-c3-focused.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist focused failure diagnostic
        if: steps.focused.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a4-c3-focused.log
          git commit -m "test(a4): capture C3 focused failure diagnostic"
          git push origin HEAD:codex/a4-editor-core-c3-20260913

      - name: Fail focused gate
        if: steps.focused.outputs.exit_code != '0'
        run: exit 1

      - name: Typecheck
        if: steps.focused.outputs.exit_code == '0'
        run: npm run typecheck

      - name: Install Chromium
        if: steps.focused.outputs.exit_code == '0'
        run: npx playwright install --with-deps chromium

      - name: Frozen browser regressions
        if: steps.focused.outputs.exit_code == '0'
        run: >-
          npx vitest run --config vitest.browser.config.ts
          __tests__/browser/a4-page-editor.browser.test.tsx
          __tests__/browser/a4-q1-acceptance.browser.test.tsx
          __tests__/browser/a4-input-sequences.browser.test.tsx
          --reporter=verbose

      - name: Commit validated C3 patch
        if: steps.focused.outputs.exit_code == '0'
        shell: bash
        run: |
          rm -f a4-c3-focused.log
          if git diff --quiet; then
            echo "No C3 patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/documents/a4-page-editor.tsx \
            src/components/documents/a4-editor-toolbar.tsx \
            __tests__/components/a4-editor-toolbar.test.tsx \
            __tests__/components/a4-page-editor.test.tsx \
            __tests__/browser/a4-page-editor.browser.test.tsx
          git commit -m "chore(a4): apply C3 editor surface patch"
          git push origin HEAD:codex/a4-editor-core-c3-20260913
