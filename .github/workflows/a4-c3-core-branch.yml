name: A4 C3 Core Branch

on:
  push:
    branches:
      - codex/a4-editor-core-c3-20260913

permissions:
  contents: write

jobs:
  diagnose-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/a4-editor-core-c3-20260913

      - name: Apply deterministic C3 source patch
        run: |
          python3 scripts/a4-c3-apply-patch.py
          python3 scripts/a4-c3-update-page-number-test.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Capture page-editor result
        shell: bash
        run: |
          set +e
          npx vitest run __tests__/components/a4-page-editor.test.tsx \
            --reporter=json --outputFile=a4-c3-page-editor-result.json
          code=$?
          echo "$code" > a4-c3-page-editor-exit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f a4-c3-page-editor-result.json a4-c3-page-editor-exit.txt
          git commit -m "test(a4): capture page-editor C3 diagnostic"
          git push origin HEAD:codex/a4-editor-core-c3-20260913
          exit 0
