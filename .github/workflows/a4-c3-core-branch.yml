name: A4 C3 Core Branch

on:
  push:
    branches:
      - codex/a4-editor-core-c3-20260913

permissions:
  contents: write

jobs:
  diagnose-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/a4-editor-core-c3-20260913

      - name: Apply deterministic C3 source patch
        run: |
          python3 scripts/a4-c3-apply-patch.py
          python3 scripts/a4-c3-update-page-number-test.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Capture remaining component exits
        shell: bash
        run: |
          set +e
          : > a4-c3-file-exits.txt
          for test_file in \
            __tests__/components/a4-editor-toolbar.test.tsx \
            __tests__/components/a4-page-editor.test.tsx \
            __tests__/components/a4-editor-session.test.ts
          do
            npx vitest run "$test_file" --reporter=dot >/dev/null 2>&1
            code=$?
            echo "$test_file=$code" >> a4-c3-file-exits.txt
          done
          cat a4-c3-file-exits.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f a4-c3-file-exits.txt
          git commit -m "test(a4): isolate C3 component diagnostic"
          git push origin HEAD:codex/a4-editor-core-c3-20260913
          exit 0
