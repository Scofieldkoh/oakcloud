name: A4 Wave-2 integration apply

on:
  push:
    branches:
      - codex/a4-editor-wave2-g2-integration-20260912
    paths:
      - .github/workflows/a4-wave2-integration-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/a4-editor-wave2-g2-integration-20260912
          fetch-depth: 0
      - name: Apply CORE-owned S2 integration wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          bridge = Path('src/components/documents/a4-editor-semantic-bridge.ts')
          bridge.write_text(r'''import { parseTemplateFields } from '@/lib/template-field-parser';
          import type {
            FieldOwnerScope,
            ParsedTemplateFieldSyntax,
          } from '@/lib/template-field-contract';
          import {
            createA4CommandDocument,
            deleteA4Selection,
            getA4ListLevelContext,
            insertA4LineBreak,
            insertA4ManualPageBreak,
            removeA4ManualPageBreak,
            type A4DeleteDirection,
            type A4ListLevelContext,
          } from './a4-pagination/structural-commands';
          import {
            a4PositionFromFlowPoint,
            flowBookmarkFromA4Selection,
            type A4PositionAffinity,
            type A4Selection,
          } from './a4-pagination/structural-position';
          import {
            applyA4S2Indent,
            continueA4S2OrderedList,
            getA4S2ContinueNumberingCapability,
            getA4S2ListIndentCapability,
            getA4S2NeutralTypingFormatPatch,
            insertA4S2ParagraphBreak,
            readA4S2FormattingState,
            restartA4S2OrderedListAtSelection,
            setA4S2ListType,
            type A4S2FormattingState,
            type A4S2IndentDirection,
            type A4S2IndentMetrics,
            type A4S2ListType,
          } from './a4-pagination/s2-semantics';
          import type { DocumentTransactionResult } from './a4-pagination/document-actions';
          import type { FlowSelectionBookmark } from './a4-pagination/selection';

          export type A4EditorSemanticCommand =
            | { type: 'insert-paragraph' }
            | { type: 'insert-line-break' }
            | {
                type: 'delete';
                direction: A4DeleteDirection;
                affinity?: A4PositionAffinity;
              }
            | { type: 'insert-manual-break' }
            | { type: 'remove-manual-break' }
            | {
                type: 'indent';
                direction: A4S2IndentDirection;
                metrics: A4S2IndentMetrics;
              }
            | { type: 'set-list-type'; listType: A4S2ListType }
            | { type: 'restart-numbering'; start: number }
            | { type: 'continue-numbering' };

          export type A4EditorSemanticCommandResult =
            | {
                status: 'applied';
                transaction: DocumentTransactionResult;
                changedNodeIds: readonly string[];
              }
            | { status: 'unchanged'; reason: string }
            | { status: 'rejected'; code: string; message: string };

          function affinityForCommand(
            command: A4EditorSemanticCommand,
          ): A4PositionAffinity {
            if (command.type === 'delete') {
              return (
                command.affinity ??
                (command.direction === 'forward' ? 'before' : 'after')
              );
            }
            return 'after';
          }

          function structuralSelectionForFlowBookmark(
            internalHtml: string,
            bookmark: FlowSelectionBookmark,
            affinity: A4PositionAffinity,
          ): {
            canonical: ReturnType<typeof createA4CommandDocument>;
            selection: A4Selection;
          } | null {
            const canonical = createA4CommandDocument(internalHtml);
            const collapsed = bookmark.collapsed;
            const anchor = a4PositionFromFlowPoint(
              canonical,
              bookmark.anchor,
              collapsed ? affinity : 'after',
            );
            const focus = a4PositionFromFlowPoint(
              canonical,
              bookmark.focus,
              collapsed ? affinity : 'after',
            );
            if (anchor.status === 'rejected' || focus.status === 'rejected') {
              return null;
            }
            return {
              canonical,
              selection: { anchor: anchor.position, focus: focus.position },
            };
          }

          /**
           * CORE integration adapter. SEMANTICS owns every structural/list
           * operation. This bridge translates C1 FlowSelectionBookmark state to
           * S1/S2 structural transactions and translates the resulting selection
           * back. It never allocates a revision/history entry or reconstructs
           * canonical state from projected pages.
           */
          export function runA4EditorSemanticCommand(
            internalHtml: string,
            bookmark: FlowSelectionBookmark,
            command: A4EditorSemanticCommand,
          ): A4EditorSemanticCommandResult {
            const structural = structuralSelectionForFlowBookmark(
              internalHtml,
              bookmark,
              affinityForCommand(command),
            );
            if (!structural) {
              return {
                status: 'rejected',
                code: 'invalid-position',
                message: 'The rendered selection no longer maps to the canonical document.',
              };
            }

            const result = (() => {
              switch (command.type) {
                case 'insert-paragraph':
                  return insertA4S2ParagraphBreak(structural.canonical, structural.selection);
                case 'insert-line-break':
                  return insertA4LineBreak(structural.canonical, structural.selection);
                case 'delete':
                  return deleteA4Selection(
                    structural.canonical,
                    structural.selection,
                    command.direction,
                  );
                case 'insert-manual-break':
                  return insertA4ManualPageBreak(structural.canonical, structural.selection);
                case 'remove-manual-break':
                  return removeA4ManualPageBreak(structural.canonical, structural.selection);
                case 'indent': {
                  const capability = getA4S2ListIndentCapability(
                    structural.canonical,
                    structural.selection,
                    command.direction,
                  );
                  if (!capability.applicable && capability.code !== 'not-in-list') {
                    return {
                      status: 'unchanged' as const,
                      reason: capability.reason ?? 'The list indentation command is not applicable.',
                    };
                  }
                  return applyA4S2Indent(
                    structural.canonical,
                    structural.selection,
                    command.direction,
                    command.metrics,
                  );
                }
                case 'set-list-type':
                  return setA4S2ListType(
                    structural.canonical,
                    structural.selection,
                    command.listType,
                  );
                case 'restart-numbering':
                  return restartA4S2OrderedListAtSelection(
                    structural.canonical,
                    structural.selection,
                    command.start,
                  );
                case 'continue-numbering': {
                  const capability = getA4S2ContinueNumberingCapability(
                    structural.canonical,
                    structural.selection,
                  );
                  if (!capability.applicable) {
                    return {
                      status: 'unchanged' as const,
                      reason: capability.reason ?? 'Numbering cannot continue from this selection.',
                    };
                  }
                  return continueA4S2OrderedList(
                    structural.canonical,
                    structural.selection,
                  );
                }
              }
            })();

            if (result.status !== 'applied') return result;
            const selection = flowBookmarkFromA4Selection(
              result.document,
              result.selection,
            );
            if (!selection) {
              return {
                status: 'rejected',
                code: 'invalid-result-selection',
                message: 'The semantic command result could not be mapped to the C1 selection adapter.',
              };
            }

            return {
              status: 'applied',
              transaction: {
                html: result.document.internalHtml,
                selection,
                changed: true,
              },
              changedNodeIds: result.changedNodeIds,
            };
          }

          export function getA4EditorListContext(
            internalHtml: string,
            bookmark: FlowSelectionBookmark,
          ): A4ListLevelContext | null {
            const structural = structuralSelectionForFlowBookmark(
              internalHtml,
              bookmark,
              'after',
            );
            if (!structural) return null;
            return getA4ListLevelContext(
              structural.canonical,
              structural.selection.anchor,
            );
          }

          export function readA4EditorS2FormattingState(
            internalHtml: string,
            bookmark: FlowSelectionBookmark,
          ): A4S2FormattingState | null {
            const structural = structuralSelectionForFlowBookmark(
              internalHtml,
              bookmark,
              'after',
            );
            if (!structural) return null;
            return readA4S2FormattingState(
              structural.canonical,
              structural.selection,
            );
          }

          export function getA4EditorNeutralTypingFormatPatch() {
            return getA4S2NeutralTypingFormatPatch();
          }

          /**
           * F1 parser consumption hook for view-decoration/navigation. CORE exposes
           * the parser output without inventing field grammar, identity, resolution
           * or lifecycle semantics. F2 remains the owner of field mutation transactions.
           */
          export function analyzeA4EditorFieldSource(
            content: string,
            scope: FieldOwnerScope,
          ): ParsedTemplateFieldSyntax {
            return parseTemplateFields({ content, scope });
          }
          '''.replace('          ', ''), encoding='utf-8')

          page = Path('src/components/documents/a4-page-editor.tsx')
          text = page.read_text(encoding='utf-8-sig')
          for old in [
              "  applyIndentToSelection,\n",
              "  applyListToSelection,\n",
              "  applyListStartToSelection,\n",
              "  applyOutdentToSelection,\n",
              "  readInlineToggleState,\n",
              "  toggleNestedListSelection,\n",
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f"page import removal expected once: {old!r}, got {text.count(old)}")
              text = text.replace(old, '', 1)
          text = replace_once(
              text,
              "  normalizeFormattingSpans,\n",
              "  normalizeFormattingSpans,\n  normalizeColorValue,\n",
              'normalizeColorValue import',
          )
          text = replace_once(
              text,
              "import {\n  analyzeA4EditorFieldSource,\n  runA4EditorSemanticCommand,\n  type A4EditorSemanticCommand,\n} from './a4-editor-semantic-bridge';",
              "import {\n  analyzeA4EditorFieldSource,\n  getA4EditorListContext,\n  getA4EditorNeutralTypingFormatPatch,\n  readA4EditorS2FormattingState,\n  runA4EditorSemanticCommand,\n  type A4EditorSemanticCommand,\n} from './a4-editor-semantic-bridge';",
              'bridge imports',
          )

          old_commit = """    const commitSemanticCommand = useCallback(\n      (\n        bookmark: FlowSelectionBookmark,\n        command: A4EditorSemanticCommand,\n        intentKind: CanonicalEditorIntentKind = 'structural',\n        publishParsedProjection = false,\n      ) => {\n        const result = runA4EditorSemanticCommand(\n          canonicalPagesHtml(pagesRef.current),\n          bookmark,\n          command,\n        );\n        if (result.status === 'applied') {\n          setEditorStatus(null);\n          commitUserTransaction(\n            result.transaction,\n            intentKind,\n            publishParsedProjection,\n          );\n          return true;\n        }\n        if (result.status === 'rejected') {\n          setEditorStatus(result.message);\n        }\n        return false;\n      },\n      [canonicalPagesHtml, commitUserTransaction],\n    );"""
          new_commit = old_commit + """\n\n    const commitS2Indent = useCallback(\n      (bookmark: FlowSelectionBookmark, direction: 'indent' | 'outdent') => {\n        const surface = documentSurfaceRef.current;\n        if (!surface) return false;\n        const target = Array.from(\n          surface.querySelectorAll<HTMLElement>('[data-flow-id]'),\n        ).find((element) => element.dataset.flowId === bookmark.anchor.flowId);\n        const computed = target ? getComputedStyle(target) : null;\n        const rootComputed = getComputedStyle(document.documentElement);\n        const emPx = Number.parseFloat(computed?.fontSize ?? '') || 16;\n        const remPx = Number.parseFloat(rootComputed.fontSize) || 16;\n        return commitSemanticCommand(bookmark, {\n          type: 'indent',\n          direction,\n          metrics: {\n            emPx,\n            remPx,\n            maxIndentPx: Math.max(0, pageLayout.contentWidthPx),\n          },\n        });\n      },\n      [commitSemanticCommand, pageLayout.contentWidthPx],\n    );\n\n    const applyCurrentSemanticCommand = useCallback(\n      (command: A4EditorSemanticCommand) => {\n        const surface = documentSurfaceRef.current;\n        if (!surface || effectivePreviewMode) return false;\n        if (!selectionIsWithinPageContents(surface) && !restoreSelection()) {\n          return false;\n        }\n        const bookmark = captureFlowSelection(surface);\n        if (!bookmark) return false;\n        pendingTypingFormatRef.current = null;\n        pendingTypingPointRef.current = null;\n        return commitSemanticCommand(bookmark, command);\n      },\n      [commitSemanticCommand, effectivePreviewMode, restoreSelection],\n    );\n\n    const applyCurrentS2Indent = useCallback(\n      (direction: 'indent' | 'outdent') => {\n        const surface = documentSurfaceRef.current;\n        if (!surface || effectivePreviewMode) return false;\n        if (!selectionIsWithinPageContents(surface) && !restoreSelection()) {\n          return false;\n        }\n        const bookmark = captureFlowSelection(surface);\n        if (!bookmark) return false;\n        pendingTypingFormatRef.current = null;\n        pendingTypingPointRef.current = null;\n        return commitS2Indent(bookmark, direction);\n      },\n      [commitS2Indent, effectivePreviewMode, restoreSelection],\n    );"""
          text = replace_once(text, old_commit, new_commit, 'semantic callbacks')

          old_sync = """    const syncFormattingFromSelection = useCallback(() => {\n      const surface = documentSurfaceRef.current;\n      if (!surface) return;\n      const bookmark = captureFlowSelection(surface);\n      if (!bookmark) return;\n      if (bookmark.collapsed && pendingTypingFormatRef.current) {\n        const pendingPoint = pendingTypingPointRef.current;\n        if (\n          !pendingPoint ||\n          pendingPoint.flowId !== bookmark.anchor.flowId ||\n          pendingPoint.offset !== bookmark.anchor.offset\n        ) {\n          pendingTypingFormatRef.current = null;\n          pendingTypingPointRef.current = null;\n        }\n      }\n      savedSelectionRef.current = bookmark;\n      setActiveFormats(\n        readLogicalFormatState(surface, bookmark, effectiveLayout),\n      );\n    }, [effectiveLayout]);"""
          new_sync = """    const syncFormattingFromSelection = useCallback(() => {\n      const surface = documentSurfaceRef.current;\n      if (!surface) return;\n      const bookmark = captureFlowSelection(surface);\n      if (!bookmark) return;\n      if (bookmark.collapsed && pendingTypingFormatRef.current) {\n        const pendingPoint = pendingTypingPointRef.current;\n        if (\n          !pendingPoint ||\n          pendingPoint.flowId !== bookmark.anchor.flowId ||\n          pendingPoint.offset !== bookmark.anchor.offset\n        ) {\n          pendingTypingFormatRef.current = null;\n          pendingTypingPointRef.current = null;\n        }\n      }\n      savedSelectionRef.current = bookmark;\n      const logical = readLogicalFormatState(surface, bookmark, effectiveLayout);\n      const semantic = readA4EditorS2FormattingState(\n        canonicalPagesHtml(pagesRef.current),\n        bookmark,\n      );\n      setActiveFormats(semantic ? {\n        ...logical,\n        bold: semantic.bold === 'on',\n        italic: semantic.italic === 'on',\n        underline: semantic.underline === 'on',\n        fontFamily:\n          semantic.fontFamily.state === 'uniform' && semantic.fontFamily.value\n            ? semantic.fontFamily.value\n            : logical.fontFamily,\n        fontSize:\n          semantic.fontSize.state === 'uniform' && semantic.fontSize.value\n            ? semantic.fontSize.value\n            : logical.fontSize,\n        textColor:\n          semantic.textColor.state === 'uniform' && semantic.textColor.value\n            ? normalizeColorValue(semantic.textColor.value)\n            : logical.textColor,\n        highlightColor:\n          semantic.highlightColor.state === 'uniform' && semantic.highlightColor.value\n            ? normalizeColorValue(semantic.highlightColor.value)\n            : logical.highlightColor,\n      } : logical);\n    }, [canonicalPagesHtml, effectiveLayout]);"""
          text = replace_once(text, old_sync, new_sync, 'S2 formatting sync')

          tab_anchor = """        const surface = documentSurfaceRef.current;\n        if (\n          surface &&\n          event.key === 'Delete' &&"""
          tab_insert = """        const surface = documentSurfaceRef.current;\n        if (\n          surface &&\n          event.key === 'Tab' &&\n          !event.ctrlKey &&\n          !event.metaKey &&\n          !event.altKey\n        ) {\n          const session = canonicalSessionRef.current;\n          const rendered = captureFlowSelection(surface);\n          if (session && rendered) {\n            const target = session.resolveNativeInputTarget({\n              renderedRevision: session.getRenderedProjection().documentRevision,\n              origin: 'keyboard',\n              renderedSelection: rendered,\n            });\n            if (target.ok && target.selection) {\n              const listContext = getA4EditorListContext(\n                session.getState().internalHtml,\n                target.selection,\n              );\n              if (listContext?.inList) {\n                event.preventDefault();\n                commitS2Indent(\n                  target.selection,\n                  event.shiftKey ? 'outdent' : 'indent',\n                );\n                return;\n              }\n            }\n          }\n        }\n        if (\n          surface &&\n          event.key === 'Delete' &&"""
          text = replace_once(text, tab_anchor, tab_insert, 'Tab semantic wiring')
          text = replace_once(
              text,
              "        commitSemanticCommand,\n        effectivePreviewMode,\n        handleDeleteAcrossPages,",
              "        commitSemanticCommand,\n        commitS2Indent,\n        effectivePreviewMode,\n        handleDeleteAcrossPages,",
              'keydown deps',
          )

          collapsed_old = """      if (bookmark.collapsed) {\n        setPendingTypingFormat({\n          fontFamily: null,\n          fontSize: null,\n          color: null,\n          backgroundColor: null,\n          fontWeight: null,\n          fontStyle: null,\n          textDecoration: null,\n        });"""
          collapsed_new = """      if (bookmark.collapsed) {\n        setPendingTypingFormat(getA4EditorNeutralTypingFormatPatch());"""
          text = replace_once(text, collapsed_old, collapsed_new, 'neutral typing patch')

          text = replace_once(
              text,
              """            const active =\n              pendingValue !== undefined\n                ? pendingValue !== null\n                : uniform?.[toggleField] === true;""",
              """            const semanticFormatting = readA4EditorS2FormattingState(\n              canonicalPagesHtml(pagesRef.current),\n              bookmark,\n            );\n            const active =\n              pendingValue !== undefined\n                ? pendingValue !== null\n                : semanticFormatting?.[toggleField] === 'on';""",
              'collapsed S2 toggle state',
          )
          text = replace_once(
              text,
              """          const toggleState = readInlineToggleState(\n            surface,\n            bookmark,\n            toggleField,\n          );""",
              """          const toggleState = readA4EditorS2FormattingState(\n            canonicalPagesHtml(pagesRef.current),\n            bookmark,\n          )?.[toggleField] ?? 'off';""",
              'range S2 toggle state',
          )

          text = replace_once(
              text,
              """        if (cmd === 'indent') {\n          applySelectionTransaction((html, bookmark) =>\n            applyIndentToSelection(html, bookmark),\n          );\n          return;\n        }\n\n        if (cmd === 'outdent') {\n          applySelectionTransaction((html, bookmark) =>\n            applyOutdentToSelection(html, bookmark),\n          );\n        }""",
              """        if (cmd === 'indent') {\n          applyCurrentS2Indent('indent');\n          return;\n        }\n\n        if (cmd === 'outdent') {\n          applyCurrentS2Indent('outdent');\n        }""",
              'toolbar indent routing',
          )
          text = replace_once(
              text,
              """        applyFormattingTransaction,\n        applySelectionTransaction,\n        effectiveLayout,""",
              """        applyCurrentS2Indent,\n        applyFormattingTransaction,\n        applySelectionTransaction,\n        effectiveLayout,""",
              'handleCommand deps',
          )

          old_toolbar = """        if (command.type === 'list') {\n          const listType = command.value;\n          if (listType === 'none') return;\n          applySelectionTransaction((html, bookmark) =>\n            applyListToSelection(html, bookmark, listType),\n          );\n          return;\n        }\n\n        if (command.type === 'list-start') {\n          applySelectionTransaction((html, bookmark) =>\n            applyListStartToSelection(html, bookmark, command.value),\n          );\n          return;\n        }\n\n        if (command.type === 'nest-list') {\n          applySelectionTransaction((html, bookmark) =>\n            toggleNestedListSelection(html, bookmark),\n          );\n          return;\n        }"""
          new_toolbar = """        if (command.type === 'list') {\n          const listType = command.value;\n          if (listType === 'none') return;\n          applyCurrentSemanticCommand({ type: 'set-list-type', listType });\n          return;\n        }\n\n        if (command.type === 'list-start') {\n          applyCurrentSemanticCommand({\n            type: 'restart-numbering',\n            start: command.value,\n          });\n          return;\n        }\n\n        if (command.type === 'continue-numbering') {\n          applyCurrentSemanticCommand({ type: 'continue-numbering' });\n          return;\n        }\n\n        if (command.type === 'nest-list') {\n          applyCurrentS2Indent('indent');\n          return;\n        }"""
          text = replace_once(text, old_toolbar, new_toolbar, 'list controls routing')
          text = replace_once(
              text,
              "      [applySelectionTransaction, handleCommand],",
              "      [applyCurrentS2Indent, applyCurrentSemanticCommand, applySelectionTransaction, handleCommand],",
              'toolbar deps',
          )
          page.write_text(text, encoding='utf-8')

          toolbar = Path('src/components/documents/a4-editor-toolbar.tsx')
          t = toolbar.read_text(encoding='utf-8-sig')
          t = replace_once(
              t,
              "  | { type: 'list-start'; value: number }\n  | { type: 'nest-list' }",
              "  | { type: 'list-start'; value: number }\n  | { type: 'continue-numbering' }\n  | { type: 'nest-list' }",
              'toolbar continue type',
          )
          t = replace_once(
              t,
              """        </label>\n        <ToolbarButton label=\"Decrease indent\" icon={Outdent}""",
              """        </label>\n        <ToolbarButton label=\"Continue numbering\" icon={ListOrdered} onSaveSelection={onSaveSelection} onClick={command({ type: 'continue-numbering' })} disabled={blocked || (activeFormats.list !== 'ordered' && activeFormats.list !== 'alpha')} />\n        <ToolbarButton label=\"Decrease indent\" icon={Outdent}""",
              'continue numbering control',
          )
          toolbar.write_text(t, encoding='utf-8')

          test = Path('__tests__/components/a4-editor-c2-bridge.test.ts')
          s = test.read_text(encoding='utf-8')
          s = replace_once(
              s,
              "function paragraphBookmark(html: string, offset: number): {",
              "function paragraphBookmark(html: string, offset: number, selector = 'p[data-flow-id]'): {",
              'bridge test selector signature',
          )
          s = replace_once(
              s,
              "  const paragraph = root.querySelector<HTMLElement>('p[data-flow-id]');",
              "  const paragraph = root.querySelector<HTMLElement>(selector);",
              'bridge test selector use',
          )
          marker = "\n});\n"
          addition = r'''

            it('routes Enter through S2 list semantics without duplicating later siblings', () => {
              const source = paragraphBookmark(
                '<ol start="5"><li><p>AlphaBeta</p></li><li><p>Next</p></li></ol>',
                5,
                'ol > li:first-child > p[data-flow-id]',
              );
              const result = runA4EditorSemanticCommand(
                source.html,
                source.bookmark,
                { type: 'insert-paragraph' },
              );
              expect(result.status).toBe('applied');
              if (result.status !== 'applied') return;
              const root = document.createElement('div');
              root.innerHTML = result.transaction.html;
              expect(root.querySelector('ol')?.getAttribute('start')).toBe('5');
              expect(Array.from(root.querySelectorAll('ol > li > p'), (node) => node.textContent))
                .toEqual(['Alpha', 'Beta', 'Next']);
            });

            it('routes list indentation, list conversion and numbering through S2 transactions', () => {
              const list = paragraphBookmark(
                '<ol><li><p>A</p></li><li><p>B</p></li><li><p>C</p></li></ol>',
                0,
                'ol > li:nth-child(2) > p[data-flow-id]',
              );
              const indented = runA4EditorSemanticCommand(list.html, list.bookmark, {
                type: 'indent',
                direction: 'indent',
                metrics: { emPx: 16, remPx: 16, maxIndentPx: 600 },
              });
              expect(indented.status).toBe('applied');
              if (indented.status !== 'applied') return;
              const indentedRoot = document.createElement('div');
              indentedRoot.innerHTML = indented.transaction.html;
              expect(indentedRoot.querySelectorAll('ol > li:first-child > ol > li')).toHaveLength(1);

              const paragraphs = paragraphBookmark('<p>A</p><p>B</p>', 0, 'p:first-child[data-flow-id]');
              const converted = runA4EditorSemanticCommand(paragraphs.html, paragraphs.bookmark, {
                type: 'set-list-type',
                listType: 'unordered',
              });
              expect(converted.status).toBe('applied');
              if (converted.status !== 'applied') return;
              expect(converted.transaction.html).toContain('<ul');

              const restart = paragraphBookmark(
                '<ol><li><p>A</p></li><li><p>B</p></li></ol>',
                0,
                'ol > li:nth-child(2) > p[data-flow-id]',
              );
              const restarted = runA4EditorSemanticCommand(restart.html, restart.bookmark, {
                type: 'restart-numbering',
                start: 7,
              });
              expect(restarted.status).toBe('applied');
              if (restarted.status !== 'applied') return;
              expect(restarted.transaction.html).toContain('start="7"');
            });
          '''.replace('            ', '')
          pos = s.rfind(marker)
          if pos < 0:
              raise SystemExit('bridge test final marker not found')
          s = s[:pos] + addition + s[pos:]
          test.write_text(s, encoding='utf-8')

          browser = Path('__tests__/browser/a4-input-sequences.browser.test.tsx')
          b = browser.read_text(encoding='utf-8')
          browser_addition = r'''

            it('uses S2 semantic list indentation for native Tab and Shift+Tab', async () => {
              const editorRef = createRef<A4PageEditorRef>();
              await act(async () => {
                root.render(
                  <A4PageEditor
                    ref={editorRef}
                    value={'<ol><li><p>One</p></li><li><p>Two</p></li><li><p>Three</p></li></ol>'}
                  />,
                );
              });
              const surface = await waitForEditorIdle();
              const second = surface.querySelectorAll('ol > li > p')[1] as HTMLElement | undefined;
              if (!second) throw new Error('Expected second list item');
              surface.focus();
              setCollapsedCaret(second, 1);

              await act(async () => {
                await userEvent.keyboard('{Tab}');
              });
              await waitForEditorIdle();
              let canonical = editorRef.current?.getContent() ?? '';
