name: Validate e-sign linked company signer UX

on:
  push:
    branches:
      - feat/esign-linked-company-signers

permissions:
  contents: read

concurrency:
  group: esign-linked-company-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://oakcloud:oakcloud_password@127.0.0.1:5432/oakcloud
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run linked signer rule tests
        run: npm run test:run -- __tests__/components/linked-company-signer-utils.test.ts --reporter=dot

      - name: Lint changed e-signing sources
        run: >-
          npx eslint
          src/components/esigning/prepare/esigning-step-upload.tsx
          src/components/esigning/prepare/linked-company-signer-quick-add.tsx
          src/components/esigning/prepare/linked-company-signer-utils.ts
          __tests__/components/linked-company-signer-utils.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Validate whitespace
        run: git diff --check
