name: A4 G1 bundle refresh

on:
  push:
    branches:
      - codex/a4-editor-g1-corrected-validation-20260912
    paths:
      - .github/workflows/a4-g1-bundle-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out bundle refresh branch
        uses: actions/checkout@v6
        with:
          ref: codex/a4-editor-g1-bundle-refresh-20260912
          fetch-depth: 0
      - name: Assert source candidate
        run: test "$(git rev-parse HEAD)" = "95d61b05a6f9bcf83c8ef65f3cbf9e9eff3a1529"
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate bundle
        run: npm run generate:pagination-bundle
      - name: Commit generated bundle only
        run: |
          git status --short
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "src/components/documents/a4-pagination/pagination-bundle.generated.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/documents/a4-pagination/pagination-bundle.generated.ts
          git commit -m "chore(a4-editor): refresh G1 pagination bundle"
          git push origin HEAD:codex/a4-editor-g1-bundle-refresh-20260912
