name: A4Editor W1 schema sync

on:
  push:
    branches:
      - codex/a4-editor-workflow-w1

permissions:
  contents: write

jobs:
  sync-generated-document-revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/a4-editor-workflow-w1
          fetch-depth: 0
      - name: Add frozen GeneratedDocument revision field
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          text = path.read_text()
          marker = '  templateVersion           Int?                         @map("template_version")\n'
          field = '  revision                  Int                          @default(0)\n'
          model_start = text.index('model GeneratedDocument {')
          model_end = text.index('\n}\n\nmodel DocumentGenerationBatch {', model_start)
          model = text[model_start:model_end]
          if field in model:
              print('GeneratedDocument revision field already present')
          else:
              if marker not in model:
                  raise SystemExit('Expected GeneratedDocument templateVersion marker not found')
              model = model.replace(marker, marker + field, 1)
              text = text[:model_start] + model + text[model_end:]
              path.write_text(text)
          PY
      - name: Commit schema parity when needed
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "A4Editor W1: sync GeneratedDocument revision schema"
          git push origin HEAD:codex/a4-editor-workflow-w1
