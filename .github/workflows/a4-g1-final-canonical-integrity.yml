name: A4 G1 final canonical integrity

on:
  push:
    branches:
      - codex/a4-editor-g1-corrected-validation-20260912
    paths:
      - .github/workflows/a4-g1-final-canonical-integrity.yml

permissions:
  contents: read

env:
  G1_INTEGRATION_SHA: ad7285ace280f0b4002f119f923a8e2166b9475f
  DATABASE_URL: postgresql://g1_test:g1-test-only@127.0.0.1:55440/oakcloud_g1
  TEST_DATABASE_URL: postgresql://g1_test:g1-test-only@127.0.0.1:55440/oakcloud_g1
  JWT_SECRET: g1-ci-only-build-secret-that-is-not-used-at-runtime
  ENCRYPTION_KEY: g1-ci-only-build-encryption-key
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  g1:
    name: Complete corrected G1 gate on exact integration SHA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g1_test
          POSTGRES_PASSWORD: g1-test-only
          POSTGRES_DB: oakcloud_g1
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U g1_test -d oakcloud_g1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.G1_INTEGRATION_SHA }}
          fetch-depth: 0
      - name: Assert exact source SHA
        run: test "$(git rev-parse HEAD)" = "$G1_INTEGRATION_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install and assert Node 24
        run: |
          npm ci
          node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1); console.log(process.version)"
          npm run db:generate
      - name: C1 component and session suites
        run: npx vitest run __tests__/components/a4-editor-session.test.ts __tests__/components/a4-page-editor.test.tsx __tests__/components/a4-editor-toolbar.test.tsx __tests__/components/a4-page-editor-ssr.test.tsx --reporter=verbose
      - name: S1 full pagination suite
        run: npx vitest run __tests__/components/a4-pagination --reporter=verbose
      - name: F1 C05 C06 compatibility
        run: npx vitest run __tests__/lib/template-field-contract.test.ts __tests__/lib/template-field-f0-compatibility.test.ts __tests__/lib/template-field-f1.test.ts __tests__/lib/a4-content-policy.test.ts __tests__/lib/a4-content-policy-f1.test.ts __tests__/lib/template-placeholder-storage.test.ts __tests__/lib/template-analysis.test.ts __tests__/lib/placeholder-resolver.test.ts __tests__/lib/document-generation-master-fields.test.ts --reporter=verbose
      - name: W1 sanitizer reader revision compatibility
        run: npx vitest run tests/lib/a4-editor-capabilities-w1.test.ts tests/lib/a4-editor-producer-integration-w1.test.ts tests/lib/a4-editor-server-reader-w1.test.ts tests/services/document-export-w1.test.ts tests/services/document-template-editor-save.test.ts tests/services/document-template-editor-fields.test.ts tests/services/document-template-editor-drafts.test.ts tests/document-output/document-template-editor-output.test.ts --reporter=verbose
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: All three browser suites
        run: npx vitest run --config vitest.browser.config.ts __tests__/browser/a4-input-sequences.browser.test.tsx __tests__/browser/a4-boundary-semantics.browser.test.tsx __tests__/browser/a4-page-editor.browser.test.tsx --reporter=verbose
      - name: Disposable PostgreSQL migrations and revision batch tests
        run: |
          npx prisma migrate deploy
          npx vitest run __tests__/integration/a4-editor-workflow-w1.postgres.test.ts __tests__/integration/document-generation-batch.postgres.test.ts --maxWorkers=1 --reporter=verbose
      - name: Pagination bundle freshness
        run: |
          grep -q 'w1-s1-structural-v1' src/components/documents/a4-pagination/pagination-bundle.generated.ts
          npm run generate:pagination-bundle
          git diff --exit-code -- src/components/documents/a4-pagination/pagination-bundle.generated.ts
      - name: Lint
        run: npm run lint
      - name: Repository typecheck
        run: npm run typecheck
      - name: Project-reference typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build
