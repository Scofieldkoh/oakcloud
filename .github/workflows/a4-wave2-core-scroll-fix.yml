name: A4 Wave-2 CORE caret-follow fix

on:
  push:
    branches:
      - codex/a4-editor-wave2-g2-integration-20260912
    paths:
      - .github/workflows/a4-wave2-core-scroll-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/a4-editor-wave2-g2-integration-20260912
          fetch-depth: 0
      - name: Apply CORE-owned caret-follow correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/documents/a4-page-editor.tsx')
          text = path.read_text(encoding='utf-8')
          old = """      if (selectionPageId && viewPageId && selectionPageId !== viewPageId) {\n        if (typeof pageElement?.scrollIntoView === 'function') {\n          pageElement.scrollIntoView({ behavior: 'auto', block: 'start' });\n        }\n      } else {\n        scrollContainerRef.current.scrollTop = scrollTop;\n      }"""
          new = """      if (selectionPageId && viewPageId && selectionPageId !== viewPageId && pageElement) {\n        const scrollContainer = scrollContainerRef.current;\n        const containerRect = scrollContainer.getBoundingClientRect();\n        const pageRect = pageElement.getBoundingClientRect();\n        const pageOffset = pageRect.top - containerRect.top;\n        const targetScrollTop = Math.max(\n          scrollTop + 1,\n          scrollContainer.scrollTop + pageOffset,\n        );\n        scrollContainer.scrollTop = targetScrollTop;\n      } else {\n        scrollContainerRef.current.scrollTop = scrollTop;\n      }"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'caret-follow block: expected 1 match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/a4-wave2-core-scroll-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(a4): follow semantic caret across page reflow"
          git push origin HEAD:codex/a4-editor-wave2-g2-integration-20260912
