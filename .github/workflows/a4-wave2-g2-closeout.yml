name: A4 Wave-2 G2 blocked closeout records

on:
  push:
    branches:
      - codex/a4-editor-wave2-g2-integration-20260912
    paths:
      - .github/workflows/a4-wave2-g2-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/a4-editor-wave2-g2-integration-20260912
          fetch-depth: 0
      - name: Write blocked G2 coordination records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          core = ""
          dispatch = ""
          g2 = ""
          def dec(value):
              return base64.b64decode(value).decode('utf-8')
          core_path = Path('docs/plans/2026-09-10-a4-editor-implementation/coordination/core.md')
          dispatch_path = Path('docs/plans/2026-09-10-a4-editor-implementation/coordination/dispatch.md')
          g2_path = Path('docs/plans/2026-09-10-a4-editor-implementation/coordination/g2.md')
          core_path.write_text(core_path.read_text(encoding='utf-8') + '\n' + dec(core), encoding='utf-8')
          dispatch_path.write_text(dispatch_path.read_text(encoding='utf-8') + '\n' + dec(dispatch), encoding='utf-8')
          g2_path.write_text(dec(g2), encoding='utf-8')
          PY
          rm .github/workflows/a4-wave2-g2-closeout.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(a4): record blocked G2 candidate closeout"
          git push origin HEAD:codex/a4-editor-wave2-g2-integration-20260912
