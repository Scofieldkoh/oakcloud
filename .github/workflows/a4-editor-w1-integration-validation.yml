name: A4Editor W1 bundle finalization

on:
  push:
    branches:
      - codex/a4-editor-workflow-w1

permissions:
  contents: write

jobs:
  finalize-bundle:
    if: "${{ github.event.head_commit.message != 'chore(a4-editor): regenerate W1 pagination bundle' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate integrated pagination bundle
        run: npm run generate:pagination-bundle
      - name: Verify generated diff hygiene
        run: git diff --check
      - name: Commit generated bundle under CORE integration lease
        run: |
          if git diff --quiet -- src/components/documents/a4-pagination/pagination-bundle.generated.ts; then
            echo "Pagination bundle already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/documents/a4-pagination/pagination-bundle.generated.ts
          git commit -m "chore(a4-editor): regenerate W1 pagination bundle"
          git push
