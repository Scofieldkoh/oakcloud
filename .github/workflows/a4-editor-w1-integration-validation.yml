name: A4Editor W1 PDF diagnostic

on:
  push:
    branches:
      - codex/a4-editor-workflow-w1

permissions:
  contents: read

concurrency:
  group: a4-w1-pdf-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-diagnostic:
    name: W1 real PDF diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
      JWT_SECRET: ci-only-w1-validation-secret-that-is-not-used-at-runtime
      ENCRYPTION_KEY: ci-only-w1-validation-encryption-key

    steps:
      - name: Check out W1 branch
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate pagination bundle under CORE integration lease
        run: npm run generate:pagination-bundle

      - name: Install isolated Chromium
        run: |
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Run paginator and PDF diagnostic
        run: |
          mkdir -p .tmp
          cat > .tmp/a4-w1-pdf-diagnostic.ts <<'EOF'
          import { writeFileSync } from 'node:fs';
          import pdfParse from 'pdf-parse';
          import puppeteer from 'puppeteer-core';
          import { generatePDF } from '../src/services/document-export.service';
          import { A4_PAGINATION_BUNDLE } from '../src/components/documents/a4-pagination/pagination-bundle.generated';

          async function main() {
            const first = 'FIRST-W1-REAL-PDF-SENTINEL';
            const last = 'LAST-W1-REAL-PDF-SENTINEL';
            const caption = 'W1 synthetic caption';
            const layout = {
              contentWidthPx: 642,
              contentHeightPx: 971,
              fontFamily: 'Arial, sans-serif',
              fontSize: '12pt',
              lineHeight: '1.4',
              paragraphSpacing: '0.5em',
            };
            const filler = Array.from(
              { length: 90 },
              (_, i) => `<p>W1 synthetic filler paragraph ${i + 1}: pagination validation only.</p>`,
            ).join('');
            const canonicalHtml = [
              `<h1>${first}</h1>`,
              '<ol start="5"><li><p>Number five</p><ul><li>Nested item</li></ul></li><li>Number six</li></ol>',
              '<blockquote>W1 synthetic quotation</blockquote>',
              `<table><caption>${caption}</caption><tbody><tr><td>Body cell</td></tr></tbody><tfoot><tr><td>Footer cell</td></tr></tfoot></table>`,
              '<p>Field: <span data-field-id="w1-proof-field" contenteditable="false">Synthetic field value</span></p>',
              filler,
              '<p>Before explicit break<span data-a4-break="page"></span>After explicit break</p>',
              '<p>Legacy break follows</p><div class="page-break" data-break-type="hard"></div><p>After legacy break</p>',
              `<p>${last}</p>`,
            ].join('');

            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME_PATH,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
            });
            let fragments: Array<{ content: string; hardBreakBefore: boolean; oversized?: boolean }> = [];
            try {
              const page = await browser.newPage();
              await page.setContent('<!doctype html><html><body></body></html>');
              await page.addScriptTag({ content: A4_PAGINATION_BUNDLE });
              fragments = await page.evaluate(({ canonicalHtml, layout }) => {
                const api = (window as unknown as { A4Pagination?: { paginateA4Document: (html: string, layout: unknown) => Array<{ content: string; hardBreakBefore: boolean; oversized?: boolean }> } }).A4Pagination;
                if (!api) throw new Error('A4Pagination bundle API unavailable');
                return api.paginateA4Document(canonicalHtml, layout);
              }, { canonicalHtml, layout });
              await page.close();
            } finally {
              await browser.close();
            }

            const fragmentHtml = fragments.map((fragment) => fragment.content).join('\n');
            writeFileSync('.tmp/a4-w1-fragments.json', JSON.stringify(fragments, null, 2));
            console.log(JSON.stringify({
              fragmentCount: fragments.length,
              captionInSource: canonicalHtml.includes(caption),
              captionInFragments: fragmentHtml.includes(caption),
              captionTagInFragments: fragmentHtml.includes(`<caption>${caption}</caption>`),
            }));
            if (!fragmentHtml.includes(caption)) throw new Error('Browser paginator lost caption before PDF generation');

            const shell = '<!doctype html><html><head><meta charset="utf-8"></head><body><div id="a4-paginated-sections"><section class="print-page"><div class="content"></div></section></div></body></html>';
            const buffer = await generatePDF(shell, {
              format: 'A4',
              orientation: 'portrait',
              margins: { top: 20, right: 20, bottom: 20, left: 20 },
              headerHtml: '',
              footerHtml: '',
              pagination: { canonicalHtml, layout },
            });
            writeFileSync('.tmp/a4-w1-proof.pdf', buffer);
            const parsed = await pdfParse(buffer);
            writeFileSync('.tmp/a4-w1-pdf-text.txt', parsed.text);
            const normalized = parsed.text.replace(/\s+/g, ' ').trim();
            console.log(JSON.stringify({
              bytes: buffer.length,
              pages: parsed.numpages,
              captionExact: parsed.text.includes(caption),
              captionNormalized: normalized.includes(caption),
              firstIndex: normalized.indexOf(first),
              captionIndex: normalized.indexOf(caption),
              lastIndex: normalized.indexOf(last),
            }));
            console.log('PDF_NORMALIZED_TEXT=' + normalized);

            if (buffer.length < 1000) throw new Error(`PDF buffer unexpectedly small: ${buffer.length}`);
            if (parsed.numpages < 2) throw new Error(`Expected at least 2 pages, received ${parsed.numpages}`);
            const firstIndex = normalized.indexOf(first);
            const lastIndex = normalized.indexOf(last);
            if (firstIndex < 0 || lastIndex <= firstIndex) throw new Error('PDF sentinel order is incorrect');
            for (const expected of [
              'Number five',
              'Nested item',
              'W1 synthetic quotation',
              caption,
              'Footer cell',
              'Synthetic field value',
              'After explicit break',
              'After legacy break',
            ]) {
              if (!normalized.includes(expected)) throw new Error(`Normalized PDF text missing: ${expected}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF
          npx tsx .tmp/a4-w1-pdf-diagnostic.ts

      - name: Upload PDF diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-editor-w1-pdf-diagnostic
          path: |
            .tmp/a4-w1-proof.pdf
            .tmp/a4-w1-pdf-text.txt
            .tmp/a4-w1-fragments.json
            src/components/documents/a4-pagination/pagination-bundle.generated.ts
          if-no-files-found: warn
          retention-days: 7
